app = "pinky-swear-frontend"
primary_region = "sin"

[build]
    dockerfile = "frontend/Dockerfile"
    ignorefile = ".dockerignore"

[http_service]
    internal_port = 80
    force_https = true
    auto_stop_machines = "off"
    auto_start_machines = true
    min_machines_running = 1

    [[http_service.checks]]
        grace_period = "10s"
        interval = "30s"
        method = "GET"
        timeout = "5s"
        path = "/"

[[restart]]
    policy = "on-failure"
    retries = 5
